name: Protocol v3 blueprint operation budget freeze
"on": { pull_request: { types: [opened, synchronize, reopened, edited, ready_for_review] } }
permissions: { contents: read }
jobs:
  renamed-budget-job:
    name: Require immutable protocol-v3 operation budget enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ github.sha }}" }
      - run: pnpm install --frozen-lockfile
      - run: |
          BASES=("$(git merge-base --all "$UPSTREAM_SHA" HEAD)")
          if [ "${#BASES[@]}" -ne 1 ]; then exit 1; fi
          git cat-file -e "${BASES[0]}:$SUCCESSOR"
          git show "${BASES[0]}:$SUCCESSOR" > "$RUNNER_TEMP/base.mjs"
          node "$RUNNER_TEMP/base.mjs" "$UPSTREAM_SHA"
          node packages/protocol-v3/conformance/freeze-successor-v1/check-freeze.mjs "$UPSTREAM_SHA"
