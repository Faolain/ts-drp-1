name: Protocol v3 equivocation digest identity freeze

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  protocol-v3-equivocation-digest-identity:
    name: Require immutable protocol-v3 equivocation digest identity supplement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run merge-base-pinned equivocation digest identity checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKER: packages/protocol-v3/supplements/equivocation-digest-identity-v1/check-freeze.mjs
          POLICY: packages/protocol-v3/supplements/equivocation-digest-identity-v1/freeze-policy.json
          MODEL: packages/protocol-v3/supplements/equivocation-digest-identity-v1/equivocation-digest-identity.qnt
          PROFILE: packages/protocol-v3/supplements/equivocation-digest-identity-v1/profile.json
          SPECIFICATION: packages/protocol-v3/supplements/equivocation-digest-identity-v1/spec.md
          RED_TEST: tests/protocol-v3-equivocation-0o.test.ts
          RED_CONTRACT: tests/fixtures/phase-0o-v3/equivocation-contract.json
        run: |
          if git cat-file -e "$BASE_SHA:$CHECKER"; then
            git show "$BASE_SHA:$CHECKER" > "$RUNNER_TEMP/check-equivocation-digest-identity-freeze.mjs"
            PROTOCOL_V3_EQUIVOCATION_DIGEST_IDENTITY_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              node "$RUNNER_TEMP/check-equivocation-digest-identity-freeze.mjs" "$BASE_SHA"
          elif ! git cat-file -e "$BASE_SHA:$POLICY" \
            && ! git cat-file -e "$BASE_SHA:$MODEL" \
            && ! git cat-file -e "$BASE_SHA:$PROFILE" \
            && ! git cat-file -e "$BASE_SHA:$SPECIFICATION" \
            && ! git cat-file -e "$BASE_SHA:$RED_TEST" \
            && ! git cat-file -e "$BASE_SHA:$RED_CONTRACT"; then
            node packages/protocol-v3/supplements/equivocation-digest-identity-v1/check-freeze.mjs "$BASE_SHA"
          else
            echo "Equivocation digest identity freeze bootstrap is fail-closed and atomic." >&2
            exit 1
          fi
          node packages/protocol-v3/supplements/equivocation-digest-identity-v1/check-freeze.mjs "$BASE_SHA"
