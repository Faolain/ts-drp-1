name: Protocol v3 seal digest identity freeze

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  protocol-v3-seal-digest-identity:
    name: Require immutable protocol-v3 seal digest identity supplement
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install pinned workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run merge-base-pinned seal digest identity checker
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKER: packages/protocol-v3/supplements/seal-digest-identity-v1/check-freeze.mjs
          POLICY: packages/protocol-v3/supplements/seal-digest-identity-v1/freeze-policy.json
          PROFILE: packages/protocol-v3/supplements/seal-digest-identity-v1/profile.json
          SCHEMA: packages/protocol-v3/supplements/seal-digest-identity-v1/schema.json
          SPECIFICATION: packages/protocol-v3/supplements/seal-digest-identity-v1/spec.md
          VECTORS: packages/protocol-v3/supplements/seal-digest-identity-v1/vectors.json
          WORKFLOW: .github/workflows/protocol-v3-seal-digest-identity.yml
          RED_TEST: tests/phase-5a-seal-digest-law-red.test.ts
          RED_CONTRACT: tests/fixtures/phase-5-v3/seal-digest-law-contract.json
        run: |
          if git cat-file -e "$BASE_SHA:$CHECKER"; then
            git show "$BASE_SHA:$CHECKER" > "$RUNNER_TEMP/check-seal-digest-identity-base.mjs"
            PROTOCOL_V3_SEAL_DIGEST_IDENTITY_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              node "$RUNNER_TEMP/check-seal-digest-identity-base.mjs" "$BASE_SHA"
          elif ! git cat-file -e "$BASE_SHA:$POLICY" \
            && ! git cat-file -e "$BASE_SHA:$PROFILE" \
            && ! git cat-file -e "$BASE_SHA:$SCHEMA" \
            && ! git cat-file -e "$BASE_SHA:$SPECIFICATION" \
            && ! git cat-file -e "$BASE_SHA:$VECTORS" \
            && ! git cat-file -e "$BASE_SHA:$WORKFLOW" \
            && ! git cat-file -e "$BASE_SHA:$RED_TEST" \
            && ! git cat-file -e "$BASE_SHA:$RED_CONTRACT"; then
            PROTOCOL_V3_SEAL_DIGEST_IDENTITY_REPOSITORY_ROOT="$GITHUB_WORKSPACE" node "$CHECKER" "$BASE_SHA"
          else
            echo "Seal digest identity bootstrap is fail-closed and atomic." >&2
            exit 1
          fi
          PROTOCOL_V3_SEAL_DIGEST_IDENTITY_REPOSITORY_ROOT="$GITHUB_WORKSPACE" node "$CHECKER" "$BASE_SHA"
