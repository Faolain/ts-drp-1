name: Protocol v3 blueprint numeric determinism freeze

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  protocol-v3-blueprint-numeric-determinism:
    name: Require immutable protocol-v3 blueprint numeric determinism
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run merge-base-pinned blueprint numeric determinism successor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKER_V2: packages/protocol-v3/conformance/blueprint-numeric-determinism-successor-v2/check-freeze.mjs
          POLICY_V2: packages/protocol-v3/conformance/blueprint-numeric-determinism-successor-v2/freeze-policy.json
        run: |
          if git cat-file -e "$BASE_SHA:$CHECKER_V2" && git cat-file -e "$BASE_SHA:$POLICY_V2"; then
            git show "$BASE_SHA:$CHECKER_V2" > "$RUNNER_TEMP/check-blueprint-numeric-determinism-successor-v2.mjs"
            PROTOCOL_V3_BLUEPRINT_NUMERIC_SUCCESSOR_REPOSITORY_ROOT="$GITHUB_WORKSPACE" node "$RUNNER_TEMP/check-blueprint-numeric-determinism-successor-v2.mjs" "$BASE_SHA"
            PROTOCOL_V3_BLUEPRINT_NUMERIC_SUCCESSOR_REPOSITORY_ROOT="$GITHUB_WORKSPACE" node "$CHECKER_V2" "$BASE_SHA"
          elif ! git cat-file -e "$BASE_SHA:$CHECKER_V2" && ! git cat-file -e "$BASE_SHA:$POLICY_V2"; then
            PROTOCOL_V3_BLUEPRINT_NUMERIC_SUCCESSOR_REPOSITORY_ROOT="$GITHUB_WORKSPACE" node "$CHECKER_V2" "$BASE_SHA"
          else
            echo "Partial numeric successor base is forbidden." >&2
            exit 1
          fi
      - run: pnpm exec vitest run tests/eslint-plugin-ts-drp-numeric-determinism-0n-a.test.ts --coverage.enabled=false --exclude '.logs/**'
