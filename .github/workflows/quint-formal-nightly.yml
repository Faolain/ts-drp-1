name: Quint formal models (nightly)

# Nightly tier of scripts/quint/quint-ci.mjs: the PR tier at 10x samples, the pre-fix variants that
# need more samples than a PR run can afford, Apalache at each critical model's recorded depth, and
# the delegated Track J / protocol-v3 checkers. Policy: scripts/quint/manifest.json.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      filter:
        description: "Only run checks whose file (or external name) matches this regex"
        required: false
        default: "."

permissions:
  contents: read

jobs:
  quint-formal-nightly:
    name: Quint models (nightly tier)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        ref: [perf/integration-7, main]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ref }}
      - name: Skip refs without the runner
        id: present
        run: |
          if [ -f scripts/quint/quint-ci.mjs ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "scripts/quint is not on ${{ matrix.ref }} yet"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.present.outputs.run == 'true'
        with:
          node-version: "22"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.present.outputs.run == 'true'
        with:
          version: "10.24.0"
      - name: Install pinned workspace dependencies
        if: steps.present.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Apalache (quint verify) and the TLC checks of the delegated runners need Java 17.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: steps.present.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "17"
      # quint downloads its Rust simulator and Apalache into ~/.quint on first use.
      - uses: actions/cache@v4
        if: steps.present.outputs.run == 'true'
        with:
          path: ~/.quint
          key: quint-nightly-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Run the Quint nightly tier
        if: steps.present.outputs.run == 'true'
        env:
          APALACHE_VERSION: "0.56.1"
          TRACK_J_JOBS: "2"
        run: pnpm run formal:nightly --jobs 4 --filter "${{ github.event.inputs.filter || '.' }}" --json "$RUNNER_TEMP/quint-nightly.json"
      - name: Upload results
        if: always() && steps.present.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quint-nightly-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/quint-nightly.json
          if-no-files-found: ignore
