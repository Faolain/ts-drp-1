name: Workflow - release
on:
  release:
    types: [published]
jobs:
  phase-0j-c-release-conformance:
    name: Protocol v3 blueprint nightly conformance
    secrets: inherit
    uses: ./.github/workflows/protocol-v3-blueprint-conformance.yml
    with:
      tier: nightly

  phase-2k-browser-currency:
    name: Browser currency launch gate
    needs:
      - phase-0j-c-release-conformance
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm exec playwright test --config playwright.browser-currency.config.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: phase-2k-browser-currency-release
          path: |
            test-results/phase-2k/browser-matrix-currency.json
            test-results/phase-2k/phase-2k/**
            test-results/phase-2k/playwright/**

  npm_publish:
    name: Publish packages to npmjs
    secrets: inherit
    permissions:
      id-token: write
      packages: write
    uses: ./.github/workflows/npm-publish.yml
    needs:
      - phase-2k-browser-currency

  publish_buf_registry:
    name: Publish buf files
    secrets: inherit
    permissions:
      contents: read
    needs:
      - npm_publish
    uses: ./.github/workflows/buf-registry.yml

  build_docker_images:
    name: Build Docker Images
    permissions:
      packages: write
    needs:
      - npm_publish
    uses: ./.github/workflows/docker.yml
