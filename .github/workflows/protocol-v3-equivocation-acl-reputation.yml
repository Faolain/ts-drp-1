name: Protocol v3 equivocation ACL reputation freeze

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  protocol-v3-equivocation-acl-reputation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_PATH: ${{ github.workspace }}/packages/protocol-v3/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Freeze provenance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUCCESSOR: packages/protocol-v3/conformance/freeze-successor-v1/check-freeze.mjs
        run: |
          node packages/protocol-v3/supplements/equivocation-digest-identity-v1/check-freeze.mjs "$BASE_SHA"
          node packages/protocol-v3/supplements/equivocation-evidence-projection-v1/check-freeze.mjs "$BASE_SHA"
          mapfile -t MERGE_BASES < <(git merge-base --all "$BASE_SHA" HEAD)
          if [ "${#MERGE_BASES[@]}" -ne 1 ]; then exit 1; fi
          MERGE_BASE="${MERGE_BASES[0]}"
          if git cat-file -e "$MERGE_BASE:$SUCCESSOR"; then
            git show "$MERGE_BASE:$SUCCESSOR" > "$RUNNER_TEMP/base-freeze-successor.mjs"
            PROTOCOL_V3_FREEZE_SUCCESSOR_REPOSITORY_ROOT="$GITHUB_WORKSPACE" \
              node "$RUNNER_TEMP/base-freeze-successor.mjs" "$BASE_SHA"
          fi
          node "$SUCCESSOR" "$BASE_SHA"
      - name: Controlled and production contract serially
        run: |
          PHASE_0O_B3_IMPLEMENTATION_MODULE=tests/fixtures/phase-0o-b3-v3/controlled-acl-reputation.ts pnpm exec vitest run tests/protocol-v3-equivocation-acl-reputation-0o-b3.test.ts --no-coverage --maxWorkers=1 --minWorkers=1
          pnpm exec vitest run tests/protocol-v3-equivocation-acl-reputation-0o-b3.test.ts --no-coverage --maxWorkers=1 --minWorkers=1
      - name: Audit public roots
        run: |
          pnpm --filter @ts-drp/protocol-v3 build
          pnpm exec tsc -p tests/fixtures/phase-0o-b3-v3/tsconfig.public-entry-audit.json
          pnpm exec tsc -p tests/fixtures/phase-0o-b3-v3/tsconfig.built-package-audit.json
          node --import tsx tests/fixtures/phase-0o-b3-v3/public-export-contract.mjs
